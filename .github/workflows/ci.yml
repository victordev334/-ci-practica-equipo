name: CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install pytest pytest-cov

      - name: Ejecutar pruebas
        run: |
          pytest -v --cov=calculadora --cov-report=term-missing --cov-report=xml --junitxml=resultados-pruebas.xml

      - name: Resumen de métricas
        if: always()
        run: |
          {
            echo "## Métricas de pruebas"
            echo '```'
            python -m coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            resultados-pruebas.xml
            coverage.xml

      - name: Build proyecto
        run: |
          mkdir artefactos
          cp calculadora.py artefactos/
      - name: Generar ZIP
        run: |
          zip -r artefacto.zip artefactos
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: build-python
          path: artefacto.zip